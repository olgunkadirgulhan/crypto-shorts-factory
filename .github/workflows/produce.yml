name: Produce crypto short

on:
  schedule:
    # Three videos a day, UTC. run.mjs maps the hour to a slot:
    # <12:00 -> open, <17:00 -> mover, else -> trending.
    # GitHub may fire a cron up to ~15 min late; these times stay inside their slot.
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Which format to produce
        type: choice
        default: open
        options: [open, mover, trending]
      dry_run:
        description: Render but do not upload
        type: boolean
        default: false

concurrency:
  group: produce
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: System libraries for headless Chrome + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 \
            libpango-1.0-0 libcairo2 libcups2 fonts-liberation || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true
          # ffmpeg is NOT guaranteed preinstalled on ubuntu-latest - install it
          # explicitly. The apt package ships both ffmpeg and ffprobe together.
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund
          pip install --disable-pip-version-check -r requirements.txt
          npx remotion browser ensure || true

      - name: Produce and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY || 'unlisted' }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '28' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AndrewMultilingualNeural' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node pipeline/run.mjs \
            ${{ inputs.slot && format('--slot={0}', inputs.slot) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Keep the rendered file for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/*.mp4
            out/props.json
          retention-days: 7
          if-no-files-found: ignore

      # Committing state each run also keeps the schedule alive: GitHub disables
      # cron workflows on repositories with 60 days of no activity.
      - name: Commit run state
        if: always()
        run: |
          git config user.name "crypto-shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state archive 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: run ${{ github.run_number }}"
          git push || true
